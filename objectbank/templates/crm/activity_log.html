{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="row">
	<div class="col">
		<h2>Activity Log</h2>
	</div>
	<div class="col text-end">
		<a href="{% url 'activity_log_add' %}" class="btn btn-primary btn-sm btn-curve" title="Add Activity Log">
			<i class="fas fa-plus"></i></a>
	</div>
</div>

<table class="table table-striped table-bordered" id="activity-log-table">
	<thead class="table-dark">
		<tr>
			<th>Lead</th>
			<th>Type</th>
			<th>Follow Up</th>
		</tr>
	</thead>
	<tbody class="two-col-form">
		{% for activity_log in activity_logs %}
		<tr onclick="window.location='{% url 'activity_log_edit' activity_log.id %}'" style="cursor: pointer;">
			<td>{{ activity_log.lead }}</td>
			<td>{{ activity_log.get_type_display }}</td>
			<td>{{ activity_log.follow_up_date }}</td>
		</tr>
		{% endfor %}
	</tbody>
</table>

{% endblock %}

{% block script %}
<script>
function initDataTable() {
    var isMobile = window.innerWidth <= 768;
    $('#activity-log-table').DataTable({
        destroy: true,
        "order": [],
        "columnDefs": [],
        "paging": true,
        "lengthChange": !isMobile,
        "searching": true,
        "ordering": true,
    });
}

$(document).ready(function () {
    initDataTable();

    $(window).on('resize', function () {
        initDataTable();
    });
});
</script>
{% endblock %}

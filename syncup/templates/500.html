<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    {% include "mobileapi/_theme_color.html" with light="#f6f8fb" dark="#0b0f17" %}
    <title>Something went wrong</title>
    <style>
        :root { color-scheme: light dark; --bg: #f6f8fb; --card: #ffffff; --text: #0f172a;
                --muted: #5b6472; --accent: #2563eb; --border: #e2e8f0; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0b0f17; --card: #131a26; --text: #e6eaf2; --muted: #9aa4b2;
                    --accent: #60a5fa; --border: #223049; }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { display: flex; align-items: center; justify-content: center; padding: 24px;
               background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .card { width: 100%; max-width: 420px; text-align: center; background: var(--card);
                border: 1px solid var(--border); border-radius: 16px; padding: 40px 28px; }
        .code { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: var(--accent); }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
        a { display: inline-block; padding: 10px 22px; border-radius: 10px; background: var(--accent);
            color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">500</div>
        <h1>Something went wrong</h1>
        <p>Please try again in a moment.</p>
        <a href="/">Go to home</a>
    </main>
</body>
</html>

{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="row align-items-center mb-3">
    <div class="col">
        <h2 class="mb-0">Incentives</h2>
    </div>

    <div class="col-auto">
        <form method="GET" class="d-flex align-items-center gap-2">
            <select name="filter" class="form-control form-control-sm" onchange="this.form.submit()">
                <option value="">All Users</option>
                {% for name, user_id in users %}
                    <option value="{{ user_id }}" {% if user_id == selected_user %}selected{% endif %}>
                        {{ name }}
                    </option>
                {% endfor %}
            </select>
        </form>
    </div>

    <div class="col-auto">
        <a href="{% url 'employee_incentive_add' %}" class="btn btn-primary btn-sm btn-curve" 
           title="Add Employee Incentive"><i class="fas fa-plus"></i>
        </a>
    </div>
</div>

<table class="table table-striped table-bordered" id="employee-incentive-table">
	<thead class="table-dark">
		<tr>
			<th>Name</th>
			<th>Date</th>
			<th>Amount</th>
		</tr>
	</thead>
	<tbody class="two-col-form">
		{% for employee_incentive in employee_incentives %}
		<tr onclick="window.location='{% url 'employee_incentive_edit' employee_incentive.id %}'" 
            style="cursor: pointer;" class="{% if employee_incentive.is_paid %}table-success{% else %}table-danger{% endif %}">
			<td>{{ employee_incentive.user }}</td>
			<td>{{ employee_incentive.date }}</td>
			<td>{{ employee_incentive.amount }}</td>
		</tr>
		{% endfor %}
	</tbody>
</table>

{% endblock %}

{% block script %}
<script>
function initDataTable() {
    var isMobile = window.innerWidth <= 768;
    $('#employee-incentive-table').DataTable({
        destroy: true,
        "order": [],
        "columnDefs": [],
        "paging": true,
        "lengthChange": !isMobile,
        "searching": true,
        "ordering": true,
    });
}

$(document).ready(function () {
    initDataTable();

    $(window).on('resize', function () {
        initDataTable();
    });
});
</script>
{% endblock %}

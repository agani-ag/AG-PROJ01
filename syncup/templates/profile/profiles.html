{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="row">
	<div class="col">
		<h2>Users</h2>
	</div>
	<div class="col text-end">
		<a href="{% url 'signup' %}?admin=true" class="btn btn-primary btn-sm btn-curve" title="Add User">
			<i class="fas fa-plus"></i></a>
	</div>
</div>

<table class="table table-striped table-bordered" id="user-table">
	<thead class="table-dark">
		<tr>
			<th>Name</th>
			<th>Phone</th>
		</tr>
	</thead>
	<tbody class="two-col-form">
		{% for user in user_profiles %}
		<tr onclick="window.location='{% url 'profile_admin_edit' user.user_id %}'" style="cursor: pointer;">
			<td>{{ user.name }}</td>
			<td>{% if user.phone %}
					<a href="tel:{{ user.phone }}" style="text-decoration: none;">{{ user.phone }}</a>
				{% else %}
					<span class="text-danger">N/A</span>
				{% endif %}
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>

{% endblock %}

{% block script %}
<script>
$(document).ready( function () {
	var isMobile = window.innerWidth <= 768;
	$('#user-table').DataTable({
		"order": [],
		"columnDefs": [],
		"paging": true,
        "lengthChange": !isMobile,
        "searching": true,
        "ordering": true,
        });
});
</script>
{% endblock %}

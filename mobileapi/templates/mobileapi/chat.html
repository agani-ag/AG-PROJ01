<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <!-- Status-bar colour for the app WebView: matches the sticky header (--bar). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1622" media="(prefers-color-scheme: dark)">
    <meta name="csrf" content="{{ csrf_token }}">
    <title>Chat with Admin</title>
    <style>
        :root {
            --bg: #f6f8fb; --surface: #ffffff; --border: #e2e8f0;
            --text: #0f172a; --muted: #5b6472;
            --me-bg: #2563eb; --me-text: #ffffff;
            --them-bg: #ffffff; --them-text: #0f172a;
            --bar: #ffffff; --sep: rgba(0,0,0,.06);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f17; --surface: #131a26; --border: #223049;
                --text: #e6eaf2; --muted: #9aa4b2;
                --them-bg: #1b2536; --them-text: #e6eaf2;
                --bar: #0f1622; --sep: rgba(255,255,255,.08);
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; height: 100%; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
            display: flex; flex-direction: column; }
        header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bar);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
        .hdr-avatar { position: relative; width: 42px; height: 42px; border-radius: 50%; background: #111827;
            display: flex; align-items: center; justify-content: center; flex: 0 0 42px; }
        .hdr-avatar svg { width: 24px; height: 24px; }
        .hdr-presence { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%;
            background: #22c55e; border: 2.5px solid var(--bar); display: none; }
        .hdr-presence.show { display: block; }
        header .title { font-weight: 700; font-size: 17px; }
        header small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); min-height: 15px; }
        header small.on { color: #16a34a; font-weight: 600; }

        #thread { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; }
        #messages { margin-top: auto; }

        .date-sep { text-align: center; margin: 12px 0 8px; }
        .date-sep span { background: var(--sep); color: var(--muted); font-size: 11.5px; padding: 3px 12px; border-radius: 999px; }

        .row { display: flex; margin-top: 10px; }
        .row.grouped { margin-top: 3px; }
        .row.me { justify-content: flex-end; }
        .row.them { justify-content: flex-start; }
        .col { display: flex; flex-direction: column; max-width: 80%; }
        .row.me .col { align-items: flex-end; }
        .row.them .col { align-items: flex-start; }
        .bubble { padding: 8px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word;
            line-height: 1.38; font-size: 15px; }
        .me .bubble { background: var(--me-bg); color: var(--me-text); border-bottom-right-radius: 5px; }
        .them .bubble { background: var(--them-bg); color: var(--them-text); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
        .row.grouped.me .bubble { border-top-right-radius: 7px; }
        .row.grouped.them .bubble { border-top-left-radius: 7px; }
        .meta { font-size: 11px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
        .meta .tick { font-weight: 700; color: var(--muted); }
        .meta .tick.read { color: var(--me-bg); }

        .typing-bubble { display: inline-flex !important; gap: 5px; align-items: center; padding: 11px 14px !important; }
        .typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block;
            animation: tb 1.2s infinite ease-in-out; }
        .typing-bubble span:nth-child(2) { animation-delay: .2s; }
        .typing-bubble span:nth-child(3) { animation-delay: .4s; }
        @keyframes tb { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

        .empty { color: var(--muted); text-align: center; margin: 40px 0; font-size: 14px; }

        .jump { position: fixed; right: 14px; bottom: 82px; z-index: 5; border: 0; border-radius: 999px;
            background: var(--me-bg); color: #fff; padding: 8px 14px; box-shadow: 0 4px 12px rgba(0,0,0,.28);
            display: none; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .jump.show { display: inline-flex; }

        form { display: flex; gap: 8px; padding: 10px; background: var(--bar); border-top: 1px solid var(--border);
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 20px; padding: 10px 14px;
            font-size: 15px; font-family: inherit; background: var(--surface); color: var(--text); max-height: 120px; }
        button.send { border: none; background: var(--me-bg); color: #fff; border-radius: 50%; width: 44px; height: 44px;
            font-size: 18px; flex: 0 0 44px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="hdr-avatar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffffff" d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
            <span class="hdr-presence" id="hdrPresence" title="Admin is active"></span>
        </div>
        <div class="hdr-text">
            <div class="title">Admin</div>
            <small id="subtitle">SyncUp support</small>
        </div>
    </header>
    <div id="thread"><div id="messages"><div class="empty" id="empty">Loading…</div></div>
        <div id="typingRow" class="row them" style="display:none"><div class="col"><div class="bubble typing-bubble"><span></span><span></span><span></span></div></div></div>
    </div>
    <button id="jump" class="jump" type="button">&#8595; <span id="jumpCount"></span></button>
    <form id="composer">
        <textarea id="input" rows="1" placeholder="Message" autocomplete="off"></textarea>
        <button type="submit" class="send" title="Send">&#10148;</button>
    </form>

    <script>
        var CSRF = document.querySelector('meta[name="csrf"]').content;
        var MESSAGES_URL = "{% url 'chat_messages' %}";
        var SEND_URL = "{% url 'chat_send' %}";
        var TYPING_URL = "{% url 'chat_typing' %}";

        var thread = document.getElementById("thread");
        var messages = document.getElementById("messages");
        var typingRow = document.getElementById("typingRow");
        var input = document.getElementById("input");
        var subtitle = document.getElementById("subtitle");
        var hdrPresence = document.getElementById("hdrPresence");
        var jump = document.getElementById("jump");
        var jumpCount = document.getElementById("jumpCount");

        var lastId = 0, seen = {}, readUptoId = 0, lastTyping = 0, newCount = 0;
        var lastDay = null, lastSender = null;

        function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
        function timeOnly(ms) { try { return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }
        function dayLabel(ms) {
            var d = new Date(ms), t = new Date();
            var same = function (a, b) { return a.toDateString() === b.toDateString(); };
            if (same(d, t)) return "Today";
            if (same(d, new Date(t.getTime() - 86400000))) return "Yesterday";
            return d.toLocaleDateString([], { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
        }
        function atBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80; }
        function scrollBottom() { thread.scrollTop = thread.scrollHeight; newCount = 0; }
        function updateJump() {
            if (atBottom()) { jump.classList.remove("show"); newCount = 0; jumpCount.textContent = ""; }
            else { jump.classList.add("show"); jumpCount.textContent = newCount ? newCount : ""; }
        }

        function render(m) {
            if (seen[m.id]) return; seen[m.id] = true;
            if (m.id > lastId) lastId = m.id;
            var e = document.getElementById("empty"); if (e) e.remove();
            var day = new Date(m.created_at_ms).toDateString();
            if (day !== lastDay) {
                var sep = document.createElement("div");
                sep.className = "date-sep"; sep.innerHTML = "<span>" + esc(dayLabel(m.created_at_ms)) + "</span>";
                messages.appendChild(sep); lastDay = day; lastSender = null;
            }
            var grouped = (m.sender === lastSender);
            var row = document.createElement("div");
            row.className = "row " + (m.sender === "user" ? "me" : "them") + (grouped ? " grouped" : "");
            row.dataset.id = m.id;
            var meta = '<span class="t">' + timeOnly(m.created_at_ms) + "</span>";
            if (m.sender === "user") meta += '<span class="tick">&#10003;</span>';   // ✓ (read state set later)
            row.innerHTML = '<div class="col"><div class="bubble">' + esc(m.body) + '</div><div class="meta">' + meta + "</div></div>";
            messages.appendChild(row);
            lastSender = m.sender;
        }

        function updateReceipts() {
            // Only the most recent outgoing message shows a tick (cleaner, WhatsApp-style).
            var els = messages.querySelectorAll(".row.me");
            for (var i = 0; i < els.length; i++) {
                var tick = els[i].querySelector(".tick"); if (!tick) continue;
                if (i === els.length - 1) {
                    tick.style.display = "";
                    var read = parseInt(els[i].dataset.id, 10) <= readUptoId;
                    tick.className = read ? "tick read" : "tick";
                    tick.innerHTML = read ? "&#10003;&#10003;" : "&#10003;";
                } else {
                    tick.style.display = "none";
                }
            }
        }

        function poll() {
            var stick = atBottom(), firstLoad = lastId === 0;
            fetch(MESSAGES_URL + "?since=" + lastId, { credentials: "same-origin" })
                .then(function (r) { if (!r.ok) throw 0; return r.json(); })
                .then(function (d) {
                    var added = 0;
                    (d.messages || []).forEach(function (m) { if (!seen[m.id]) added++; render(m); });
                    readUptoId = d.read_upto_id || readUptoId;
                    updateReceipts();
                    // Admin presence + typing
                    hdrPresence.classList.toggle("show", !!d.admin_online);   // green dot only when admin is in the chat
                    typingRow.style.display = d.admin_typing ? "flex" : "none";
                    if (d.admin_typing) { subtitle.textContent = "typing…"; subtitle.className = "on"; }
                    else if (d.admin_online) { subtitle.textContent = "Active now"; subtitle.className = "on"; }
                    else { subtitle.textContent = "SyncUp support"; subtitle.className = ""; }
                    if (firstLoad || stick) { scrollBottom(); }
                    else if (added) { newCount += added; }
                    updateJump();
                })
                .catch(function () {});
        }

        document.getElementById("composer").addEventListener("submit", function (e) {
            e.preventDefault();
            var body = input.value.trim();
            if (!body) return;
            input.value = ""; input.style.height = "auto";
            fetch(SEND_URL, {
                method: "POST", credentials: "same-origin",
                headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
                body: JSON.stringify({ body: body })
            })
                .then(function (r) { return r.json(); })
                .then(function (d) { if (d && d.message) { render(d.message); updateReceipts(); scrollBottom(); } })
                .catch(function () {});
        });

        input.addEventListener("input", function () {
            input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px";
            var now = Date.now();
            if (input.value.trim() && now - lastTyping > 3000) {
                lastTyping = now;
                fetch(TYPING_URL, { method: "POST", credentials: "same-origin", headers: { "X-CSRFToken": CSRF } }).catch(function () {});
            }
        });

        thread.addEventListener("scroll", updateJump);
        jump.addEventListener("click", function () { scrollBottom(); updateJump(); });

        poll();
        setInterval(poll, 4000);
    </script>
</body>
</html>
